<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shape Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: header with category (2D / 3D) and mode tabs; "all cards" is an even grid of tap-to-flip cards, "test" shows one big card at a time with a progress bar */
:root {
  --bg: #eef3f6;
  --fg: #1d2a33;
  --muted: #5b6b76;
  --card: #ffffff;
  --card-back: #fff8e6;
  --line: #d5dfe6;
  --edge: rgba(20, 30, 40, .28);
  --focus: #2b6cb0;
  --good: #1f8a56;
  --miss: #c2462a;
  --c1: #e4572e; --c2: #f3a712; --c3: #29a36a; --c4: #2e86de; --c5: #8e5bd8; --c6: #e0559b;
  --font-en: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-zh: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c22; --fg: #eef3f6; --muted: #9aabb6; --card: #1f2a32; --card-back: #2a2a22;
    --line: #33424d; --edge: rgba(0, 0, 0, .45); --focus: #7fb3ee; --good: #4cc98b; --miss: #ff8a66;
    --c1: #ff7a52; --c2: #ffc23d; --c3: #4cc98b; --c4: #5ba7f0; --c5: #ab83ec; --c6: #f27bb6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c22; --fg: #eef3f6; --muted: #9aabb6; --card: #1f2a32; --card-back: #2a2a22;
  --line: #33424d; --edge: rgba(0, 0, 0, .45); --focus: #7fb3ee; --good: #4cc98b; --miss: #ff8a66;
  --c1: #ff7a52; --c2: #ffc23d; --c3: #4cc98b; --c4: #5ba7f0; --c5: #ab83ec; --c6: #f27bb6;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { margin: 0; font-family: var(--font-en); font-weight: 800; font-size: clamp(28px, 5vw, 40px); line-height: 1.05; text-wrap: balance; }
h1 span { font-family: var(--font-zh); font-weight: 400; font-size: .7em; color: var(--muted); margin-left: .4em; }
.hint { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.switches { display: flex; flex-wrap: wrap; gap: 10px; }
.tabs { display: inline-flex; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { all: unset; cursor: pointer; font: 700 15px var(--font-ui); padding: 7px 16px; border-radius: 999px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font: 600 15px var(--font-ui); color: var(--fg); background: var(--card);
  border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer;
}
.pill:hover { border-color: var(--muted); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 820px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }

.card {
  all: unset; box-sizing: border-box; cursor: pointer; display: block;
  aspect-ratio: 3 / 4; width: 100%; max-width: 100%; perspective: 900px; border-radius: 20px;
}
.inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.4,.5,1);
}
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 2px solid var(--line); display: grid; place-items: center; padding: 14%;
  box-shadow: 0 4px 0 var(--line);
}
.front { background: var(--card); }
.front svg { width: 100%; height: auto; overflow: visible; }
.solid * { stroke: var(--edge); stroke-width: 1; stroke-linejoin: round; }
.solid .dash { stroke: var(--fg); stroke-opacity: .45; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.back {
  background: var(--card-back); transform: rotateY(180deg);
  align-content: center; gap: 4px; padding: 8%; text-align: center;
}
.en { font-family: var(--font-en); font-weight: 800; font-size: clamp(22px, 4.2vw, 36px); line-height: 1.05; color: var(--shape); overflow-wrap: anywhere; text-wrap: balance; }
.zh { font-family: var(--font-zh); font-size: clamp(26px, 5vw, 42px); line-height: 1.2; }
.sides { margin-top: 6px; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.card:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

/* Test mode */
.test { display: grid; justify-items: center; gap: 18px; }
.progress { width: min(360px, 100%); display: grid; gap: 6px; }
.progress-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c3); border-radius: inherit; transition: width .3s; }
.test .card { width: min(320px, 78vw); }
.test .en { font-size: clamp(34px, 9vw, 52px); }
.test .zh { font-size: clamp(38px, 10vw, 58px); }
.test .sides { font-size: 16px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 56px; }
.big {
  font: 700 18px var(--font-ui); border-radius: 16px; padding: 14px 26px; cursor: pointer;
  border: 2px solid var(--line); background: var(--card); color: var(--fg); box-shadow: 0 3px 0 var(--line);
}
.big.good { border-color: var(--good); color: var(--good); }
.big.miss { border-color: var(--miss); color: var(--miss); }

.result { display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 560px; margin: 0 auto; }
.score { font-family: var(--font-en); font-weight: 800; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .45em; color: var(--muted); }
.result p { margin: 0; font-size: 17px; }
.missed { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chip { display: grid; justify-items: center; gap: 2px; width: 92px; padding: 10px 6px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; font-size: 13px; }
.chip svg { width: 40px; height: 40px; }
.chip b { font-family: var(--font-en); font-size: 14px; line-height: 1.1; }

@media (prefers-reduced-motion: reduce) { .inner, .bar i { transition: none; } }

/* Page reset (this page is served without the artifact skeleton) */
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
.home { display: inline-block; margin-bottom: 8px; color: var(--muted); font-size: 15px; font-weight: 600; text-decoration: none; }
.home:hover { color: var(--fg); }
.home:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>

<!-- Shared shading for the 3D shapes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-ball" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="g-round" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div>
      <a class="home" href="index.html">← 返回首页</a>
      <h1>Shapes<span>认形状</span></h1>
      <p class="hint" id="hint">点一下卡片翻面，看英文和中文。再点一下翻回来。</p>
    </div>
    <div class="switches">
      <div class="tabs" role="group" aria-label="图形种类">
        <button id="set-2d" type="button" aria-pressed="true">2D 平面图形</button>
        <button id="set-3d" type="button" aria-pressed="false">3D 立体图形</button>
      </div>
      <div class="tabs" role="group" aria-label="模式">
        <button id="tab-all" type="button" aria-pressed="true">全部卡片</button>
        <button id="tab-test" type="button" aria-pressed="false">测试</button>
      </div>
    </div>
  </header>

  <div class="tools">
    <button class="pill" id="sound" type="button" aria-pressed="true">🔊 读英文：开</button>
    <button class="pill" id="shuffle" type="button">打乱顺序</button>
    <button class="pill" id="reset" type="button">全部翻回正面</button>
  </div>

  <main class="grid" id="grid" aria-label="形状卡片"></main>

  <section class="test" id="test" hidden aria-live="polite">
    <div class="progress">
      <div class="progress-row"><span id="count">第 1 张，共 16 张</span><span id="right">认对 0</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div id="slot"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="result" id="result" hidden aria-live="polite"></section>
</div>

<script>
function poly(n, r, rot) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i * 2 * Math.PI / n;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + "," + (50 + r * Math.sin(a)).toFixed(1));
  }
  return '<polygon points="' + pts.join(" ") + '"/>';
}
function star(points, ro, ri) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / points;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + "," + (52 + r * Math.sin(a)).toFixed(1));
  }
  return '<polygon points="' + pts.join(" ") + '"/>';
}
// A face of a solid: base color, plus an optional light (+) or dark (-) tint on top
function face(points, tint) {
  let s = '<polygon points="' + points + '"/>';
  if (tint) s += '<polygon points="' + points + '" fill="' + (tint > 0 ? "#fff" : "#000") + '" fill-opacity="' + Math.abs(tint) + '"/>';
  return s;
}
const UP = -Math.PI / 2;

const SETS = {
  "2d": [
    { en: "Circle",     zh: "圆形",   c: 1, svg: '<circle cx="50" cy="50" r="42"/>' },
    { en: "Semicircle", zh: "半圆形", c: 6, svg: '<path d="M4 68 A46 46 0 0 1 96 68 Z"/>' },
    { en: "Oval",       zh: "椭圆形", c: 5, svg: '<ellipse cx="50" cy="50" rx="46" ry="30"/>' },
    { en: "Square",     zh: "正方形", c: 4, svg: '<rect x="10" y="10" width="80" height="80" rx="3"/>', sides: 4 },
    { en: "Rectangle",  zh: "长方形", c: 2, svg: '<rect x="4" y="24" width="92" height="52" rx="3"/>', sides: 4 },
    { en: "Triangle",   zh: "三角形", c: 3, svg: '<polygon points="50,8 94,88 6,88"/>', sides: 3 },
    { en: "Diamond",    zh: "菱形",   c: 4, svg: '<polygon points="50,4 86,50 50,96 14,50"/>', sides: 4 },
    { en: "Star",       zh: "星形",   c: 2, svg: star(5, 46, 19) },
    { en: "Heart",      zh: "心形",   c: 6, svg: '<path d="M50 90 C20 68 4 50 4 32 C4 17 16 7 29 7 C39 7 46 13 50 22 C54 13 61 7 71 7 C84 7 96 17 96 32 C96 50 80 68 50 90 Z"/>' },
    { en: "Crescent",   zh: "月牙形", c: 2, svg: '<path d="M60 10 A40 40 0 1 0 60 90 A44 44 0 0 1 60 10 Z"/>' },
    { en: "Pentagon",   zh: "五边形", c: 3, svg: poly(5, 46, UP), sides: 5 },
    { en: "Hexagon",    zh: "六边形", c: 1, svg: poly(6, 46, 0), sides: 6 },
    { en: "Heptagon",   zh: "七边形", c: 5, svg: poly(7, 46, UP), sides: 7 },
    { en: "Octagon",    zh: "八边形", c: 1, svg: poly(8, 46, Math.PI / 8), sides: 8 },
    { en: "Nonagon",    zh: "九边形", c: 4, svg: poly(9, 46, UP), sides: 9 },
    { en: "Decagon",    zh: "十边形", c: 3, svg: poly(10, 46, Math.PI / 10), sides: 10 }
  ],
  "3d": [
    { en: "Cube", zh: "正方体", c: 4, faces: 6, solid: true,
      svg: face("14,40 64,40 64,90 14,90") + face("14,40 64,40 86,18 36,18", .3) + face("64,40 86,18 86,68 64,90", -.22) },
    { en: "Cuboid", zh: "长方体", c: 2, faces: 6, solid: true,
      svg: face("4,52 66,52 66,86 4,86") + face("4,52 66,52 94,30 32,30", .3) + face("66,52 94,30 94,64 66,86", -.22) },
    { en: "Sphere", zh: "球体", c: 1, solid: true,
      svg: '<circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="44" fill="url(#g-ball)"/>' },
    { en: "Hemisphere", zh: "半球体", c: 6, solid: true,
      svg: '<path d="M6 64 A44 44 0 0 1 94 64 A44 13 0 0 1 6 64 Z"/><path d="M6 64 A44 44 0 0 1 94 64 A44 13 0 0 1 6 64 Z" fill="url(#g-ball)"/>' },
    { en: "Cylinder", zh: "圆柱体", c: 3, solid: true,
      svg: '<path d="M20 20 L20 80 A30 11 0 0 0 80 80 L80 20 Z"/><path d="M20 20 L20 80 A30 11 0 0 0 80 80 L80 20 Z" fill="url(#g-round)"/>' +
           '<ellipse cx="50" cy="20" rx="30" ry="11"/><ellipse cx="50" cy="20" rx="30" ry="11" fill="#fff" fill-opacity=".3"/>' },
    { en: "Cone", zh: "圆锥体", c: 2, solid: true,
      svg: '<path d="M50 6 L12 80 A38 12 0 0 0 88 80 Z"/><path d="M50 6 L12 80 A38 12 0 0 0 88 80 Z" fill="url(#g-round)"/>' },
    { en: "Pyramid", zh: "四棱锥", c: 5, faces: 5, solid: true,
      svg: face("50,6 10,76 60,90") + face("50,6 60,90 92,70", -.25) +
           '<polyline class="dash" points="10,76 42,58 92,70"/><line class="dash" x1="42" y1="58" x2="50" y2="6"/>' },
    { en: "Tetrahedron", zh: "四面体", c: 1, faces: 4, solid: true,
      svg: face("46,8 8,82 70,90") + face("46,8 70,90 90,62", -.25) +
           '<line class="dash" x1="8" y1="82" x2="90" y2="62"/>' },
    { en: "Triangular Prism", zh: "三棱柱", c: 4, faces: 5, solid: true,
      svg: face("44,84 94,68 76,34 26,50", -.18) + face("6,84 44,84 26,50", .15) }
  ]
};

const $ = id => document.getElementById(id);
const grid = $("grid");
let soundOn = true;
let setKey = "2d";
let mode = "all";

function shapeSvg(s) {
  return '<svg viewBox="0 0 100 100" aria-hidden="true" fill="var(--c' + s.c + ')"' + (s.solid ? ' class="solid"' : '') + '>' + s.svg + '</svg>';
}
function countLine(s) {
  if (s.sides) return '<div class="sides">' + s.sides + ' sides · ' + s.sides + ' 条边</div>';
  if (s.faces) return '<div class="sides">' + s.faces + ' faces · ' + s.faces + ' 个面</div>';
  return '';
}

function makeCard(s, onFlip) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  b.style.setProperty("--shape", "var(--c" + s.c + ")");
  b.setAttribute("aria-label", "形状卡片，点一下翻面");
  b.innerHTML =
    '<div class="inner">' +
      '<div class="face front">' + shapeSvg(s) + '</div>' +
      '<div class="face back"><div class="en">' + s.en + '</div><div class="zh">' + s.zh + '</div>' + countLine(s) + '</div>' +
    '</div>';
  b.addEventListener("click", () => setFlipped(b, s, !b.classList.contains("flipped"), onFlip));
  return b;
}
function setFlipped(b, s, flipped, onFlip) {
  b.classList.toggle("flipped", flipped);
  b.setAttribute("aria-label", flipped ? s.en + "，" + s.zh : "形状卡片，点一下翻面");
  if (flipped) speak(s.en);
  if (onFlip) onFlip(flipped);
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderGrid(list) {
  grid.innerHTML = "";
  list.forEach(s => grid.appendChild(makeCard(s)));
}

function speak(text) {
  if (!soundOn) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.8;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Test mode ---------- */
const test = { deck: [], i: 0, right: 0, missed: [] };

function startTest(deck) {
  test.deck = shuffled(deck); test.i = 0; test.right = 0; test.missed = [];
  $("result").hidden = true;
  $("test").hidden = false;
  showTestCard();
}

function showTestCard() {
  const s = test.deck[test.i], n = test.deck.length;
  $("count").textContent = "第 " + (test.i + 1) + " 张，共 " + n + " 张";
  $("right").textContent = "认对 " + test.right;
  $("bar").style.width = (test.i / n * 100) + "%";
  const slot = $("slot");
  slot.innerHTML = "";
  const card = makeCard(s, flipped => renderActions(flipped));
  slot.appendChild(card);
  renderActions(false);
  card.focus({ preventScroll: true });

  function renderActions(flipped) {
    const box = $("actions");
    box.innerHTML = "";
    if (!flipped) {
      box.appendChild(btn("翻开看答案", "big", () => setFlipped(card, s, true, renderActions)));
    } else {
      box.appendChild(btn("✓ 认对了", "big good", () => answer(true)));
      box.appendChild(btn("✗ 没认出", "big miss", () => answer(false)));
    }
  }
}

function answer(ok) {
  const s = test.deck[test.i];
  if (ok) test.right++; else test.missed.push(s);
  test.i++;
  if (test.i < test.deck.length) showTestCard(); else showResult();
}

function showResult() {
  $("bar").style.width = "100%";
  $("test").hidden = true;
  const n = test.deck.length, r = test.right;
  const box = $("result");
  box.hidden = false;
  box.innerHTML =
    '<div class="score">' + r + '<small> / ' + n + '</small></div>' +
    '<p>' + (r === n ? "全部认对了，真棒！" : "认对了 " + r + " 个。下面这些再练练：") + '</p>';
  if (test.missed.length) {
    const wrap = document.createElement("div");
    wrap.className = "missed";
    test.missed.forEach(s => {
      const c = document.createElement("div");
      c.className = "chip";
      c.innerHTML = shapeSvg(s) + '<b>' + s.en + '</b><span>' + s.zh + '</span>';
      wrap.appendChild(c);
    });
    box.appendChild(wrap);
  }
  const acts = document.createElement("div");
  acts.className = "actions";
  if (test.missed.length) {
    const missed = test.missed.slice();
    acts.appendChild(btn("只练没认出的", "big miss", () => startTest(missed)));
  }
  acts.appendChild(btn("全部重来", "big", () => startTest(SETS[setKey])));
  box.appendChild(acts);
}

function btn(label, cls, fn) {
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

/* ---------- Category and mode ---------- */
function refresh() {
  const isTest = mode === "test";
  $("set-2d").setAttribute("aria-pressed", setKey === "2d");
  $("set-3d").setAttribute("aria-pressed", setKey === "3d");
  $("tab-all").setAttribute("aria-pressed", !isTest);
  $("tab-test").setAttribute("aria-pressed", isTest);
  grid.hidden = isTest;
  $("shuffle").hidden = isTest;
  $("reset").hidden = isTest;
  $("hint").textContent = isTest
    ? "一次看一张：先说出形状的名字，再翻开看答案。"
    : "点一下卡片翻面，看英文和中文。再点一下翻回来。";
  if (isTest) startTest(SETS[setKey]);
  else { $("test").hidden = true; $("result").hidden = true; renderGrid(SETS[setKey]); }
}

$("set-2d").addEventListener("click", () => { setKey = "2d"; refresh(); });
$("set-3d").addEventListener("click", () => { setKey = "3d"; refresh(); });
$("tab-all").addEventListener("click", () => { mode = "all"; refresh(); });
$("tab-test").addEventListener("click", () => { mode = "test"; refresh(); });
$("sound").addEventListener("click", e => {
  soundOn = !soundOn;
  e.currentTarget.setAttribute("aria-pressed", soundOn);
  e.currentTarget.textContent = soundOn ? "🔊 读英文：开" : "🔇 读英文：关";
});
$("shuffle").addEventListener("click", () => renderGrid(shuffled(SETS[setKey])));
$("reset").addEventListener("click", () => {
  grid.querySelectorAll(".card.flipped").forEach(c => {
    c.classList.remove("flipped");
    c.setAttribute("aria-label", "形状卡片，点一下翻面");
  });
});

refresh();
</script>

</body>
</html>
